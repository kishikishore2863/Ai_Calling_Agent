# LiveKit server config for the GPU/VM deployment (docker-compose, host networking).
# API keys come from the LIVEKIT_KEYS env var ("key: secret") set in docker-compose.yml.
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
redis:
  address: 127.0.0.1:6379
logging:
  level: info
