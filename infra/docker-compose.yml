# Single GPU server deployment (Phase 0 latency benchmark / first real phone calls).
# Needs: Linux + NVIDIA GPU (24 GB+) + nvidia-container-toolkit + public IP.
# Open firewall: 7880-7881/tcp, 50000-60000/udp (WebRTC), 5060/udp+tcp (SIP), 10000-20000/udp (RTP)
#
#   cp .env.example .env   # set LIVEKIT_API_KEY/SECRET, SIP_*, LLM_BASE_URL=http://127.0.0.1:8000/v1 ...
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
x-host: &host
  network_mode: host
  restart: unless-stopped

services:
  redis:
    <<: *host
    image: redis:7.4-alpine
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379"]

  livekit:
    <<: *host
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes: ["./livekit/livekit.yaml:/etc/livekit.yaml:ro"]
    depends_on: [redis]

  sip:
    <<: *host
    image: livekit/sip:${LIVEKIT_SIP_TAG:-latest}   # pin a version once tested
    environment:
      SIP_CONFIG_FILE: /etc/sip.yaml
    volumes: ["./livekit/sip.yaml:/etc/sip.yaml:ro"]
    depends_on: [livekit]

  vllm:
    <<: *host
    image: vllm/vllm-openai:${VLLM_TAG:-latest}      # pin a version once tested
    ipc: host
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - --port=8000
      - --max-model-len=8192
      - --gpu-memory-utilization=0.55      # leave room for whisper on the same GPU
      - --enable-prefix-caching            # system prompt is shared across turns/calls
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
    volumes: ["hf-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  speech:
    <<: *host
    build: {context: .., dockerfile: infra/Dockerfile.speech}
    env_file: ../.env
    environment:
      WHISPER_MODEL: large-v3-turbo
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
    volumes: ["hf-cache:/root/.cache/huggingface", "../models:/app/models"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  agent:
    <<: *host
    build: {context: .., dockerfile: infra/Dockerfile.agent}
    env_file: ../.env
    volumes: ["../data:/app/data"]
    depends_on: [livekit, vllm, speech]

volumes:
  hf-cache:
